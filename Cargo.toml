[workspace]
resolver = "2"
members = [
  "crates/sone-core",
  "crates/sone-skia",
  "crates/sone-ffi",
  "crates/sone-cli",
  "crates/sone-goldens",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/seanghay/sone"
rust-version = "1.82"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
taffy = { version = "0.9", default-features = false, features = ["std", "taffy_tree", "flexbox"] }
kurbo = "0.11"
lru = "0.12"
anyhow = "1"

# Debug builds link the same static Skia as release, so the only lever that
# matters here is our own code: `debug = 1` keeps backtraces without full DWARF,
# and optimizing dependencies keeps generic-heavy crates from bloating.
[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
