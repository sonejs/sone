# Per-fixture waivers for the raster golden harness (`cargo run -p sone-goldens`).
#
# A waiver needs a written reason. `threshold` raises the dssim ceiling for one
# fixture; `skip` drops it from the run entirely. Everything not listed here is
# held to dssim <= 0.02 against the TypeScript engine's committed JPEG.

[fixture.text-2]
reason = """
Loads an SVG over https. The Rust engine deliberately does not fetch remote
assets during a render — callers register them as `asset:<name>` — so this
fixture cannot run unchanged.
"""
skip = true

[fixture.table-2]
reason = """
Table rows are one line taller than the TypeScript engine's. taffy derives a
flex item's hypothetical cross size from its natural content width, so a cell
whose text is wider than its column wraps before the column minimum widens it;
Yoga re-measures the cell at its final width instead. Layout diff: rows differ
by exactly one line height. Tracked with table-span-row and text-1.
"""
threshold = 0.20

[fixture.table-span-row]
reason = "Same table cell cross-sizing divergence as table-2."
threshold = 0.20

[fixture.text-1]
reason = "Same table cell cross-sizing divergence as table-2."
threshold = 0.10

[fixture.text-3]
reason = """
Khmer line breaks differ from V8's `Intl.Segmenter`. Skia's bundled ICU and V8 ship different
dictionary revisions; agreement on the fixture corpus is 36/108 Khmer strings
(non-dictionary scripts match 100%, see `sone-skia/tests/break_parity.rs`).
"""
threshold = 0.05

[fixture.text-orientation]
reason = """
Contains Khmer text at 90/270 degrees, so it inherits the Khmer segmentation
divergence above; the rotated footprint then differs by whole lines.
"""
threshold = 0.20

[fixture.text-layout-1]
reason = "Khmer segmentation divergence (see text-3)."
threshold = 0.05

[fixture.text-wrap-balance-1]
reason = """
`textWrap: "balance"` inside two `flex(1)` columns. Yoga distributes the row's
free space so the greedy and balanced columns end up 526/365; taffy splits it
evenly at 445/445. The balanced paragraph itself is identical — only the column
widths that host it differ.
"""
threshold = 0.20

[fixture.text-wrap-balance-3]
reason = "Same flex free-space distribution divergence as text-wrap-balance-1."
threshold = 0.20

[fixture.text-wrap-balance-4]
reason = "Same flex free-space distribution divergence as text-wrap-balance-1."
threshold = 0.20
