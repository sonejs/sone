name: dart

on:
  push:
    branches: [main]
    paths: ["bindings/dart/**", "crates/**", "include/**", "Cargo.*", ".github/workflows/dart.yml"]
  pull_request:
    paths: ["bindings/dart/**", "crates/**", "include/**", "Cargo.*", ".github/workflows/dart.yml"]

# A newer push supersedes an older one: these runs are long, and two
# generations of them competing for runners helps nobody.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        # Bounded three ways, because this step has now hung twice: once on the
        # dpkg lock and once on an apt mirror that stopped responding mid-fetch.
        # The step timeout is the one that matters — without it a stalled
        # download eats the whole job budget and the run reports as cancelled
        # with no clue why.
        timeout-minutes: 10
        run: |
          set -euo pipefail
          if dpkg -s libfontconfig1-dev >/dev/null 2>&1; then
            echo "already installed"
            exit 0
          fi
          sudo apt-get update \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends -o DPkg::Lock::Timeout=120 \
            libfontconfig1-dev

      - name: Build the native library
        timeout-minutes: 30
        run: cargo build -p sone-ffi

      - uses: dart-lang/setup-dart@v1
      - name: Resolve dependencies
        working-directory: bindings/dart
        run: dart pub get
      # Linux only: the check is a byte comparison, and a Windows checkout
      # would fail it on line endings alone.
      - name: Check the generated builders are current
        if: runner.os == 'Linux'
        working-directory: bindings/dart
        run: |
          python3 tool/generate_nodes.py
          dart format lib/src/nodes.dart
          git diff --exit-code lib/src/nodes.dart
      - name: Analyze
        working-directory: bindings/dart
        run: dart analyze
      - name: Test
        timeout-minutes: 15
        working-directory: bindings/dart
        run: dart test
