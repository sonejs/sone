name: php

on:
  push:
    branches: [main]
    paths: ["bindings/php/**", "crates/**", "include/**", "Cargo.*", ".github/workflows/php.yml"]
  pull_request:
    paths: ["bindings/php/**", "crates/**", "include/**", "Cargo.*", ".github/workflows/php.yml"]

# A newer push supersedes an older one: these runs are long, and two
# generations of them competing for runners helps nobody.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · php ${{ matrix.php }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2022]
        php: ["8.3"]
        include:
          # composer.json claims >= 8.1, so hold one job to the floor.
          - os: ubuntu-24.04
            php: "8.1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          # noninteractive and a lock timeout: the plain form hung for
          # hours on a runner waiting for the dpkg lock.
          sudo apt-get update -o Acquire::Retries=3
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends -o DPkg::Lock::Timeout=180 \
            libfontconfig1-dev

      - name: Build the native library
        run: cargo build -p sone-ffi

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # FFI is compiled in but off by default outside CLI; the runner's
          # php.ini needs it on explicitly.
          extensions: ffi
          ini-values: ffi.enable=1
      # Linux only, for the same line-ending reason as the Dart generator check.
      - name: Check the generated header is current
        if: runner.os == 'Linux'
        run: php bindings/php/tools/generate-header.php && git diff --exit-code bindings/php/sone.h
      # The suite dies on Linux at the first native call with nothing but a
      # segfault. This narrows it to a single line before the suite runs.
      # The suite dies on Linux with nothing but a segfault. This walks the
      # same path one call at a time so the log names the line.
      - name: Probe the native boundary
        shell: bash
        working-directory: bindings/php
        run: |
          php -r '
            require "src/autoload.php";
            $root = Sone\Native::checkoutRoot();
            fwrite(STDERR, "library: " . Sone\Native::locate() . "\n");
            $ffi = Sone\Native::ffi();
            fwrite(STDERR, "cdef: ok\n");
            fwrite(STDERR, "version: " . $ffi->sone_version() . "\n");

            $engine = new Sone\Engine($root);
            fwrite(STDERR, "engine: ok\n");

            $engine->registerFontFile("Geist Mono", "$root/fixtures/font/GeistMono-Regular.ttf");
            fwrite(STDERR, "font: ok\n");

            fwrite(STDERR, "families: " . implode(",", $engine->fontFamilies()) . "\n");

            $node = Sone\Column()->size(16)->bg("red");
            $png = Sone\Sone::render($node, engine: $engine)->png();
            fwrite(STDERR, "png: " . strlen($png) . " bytes\n");

            $text = Sone\Text("hi")->font("Geist Mono")->size(12);
            $png = Sone\Sone::render($text, engine: $engine)->png();
            fwrite(STDERR, "text png: " . strlen($png) . " bytes\n");

            $pages = Sone\Sone::render($node, engine: $engine, width: 40, pageHeight: 200)->pages();
            fwrite(STDERR, "pages: " . count($pages) . "\n");

            fwrite(STDERR, "layout: " . strlen($engine->dumpLayout(Sone\Sone::render($node)->toJson())) . "\n");
            $engine->close();
            fwrite(STDERR, "closed: ok\n");
          '

      - name: Test
        working-directory: bindings/php
        run: php tests/run.php
