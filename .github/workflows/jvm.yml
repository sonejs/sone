name: jvm

on:
  push:
    branches: [main]
    paths: ["bindings/jvm/**", "crates/**", "include/**", "Cargo.*", ".github/workflows/jvm.yml"]
  pull_request:
    paths: ["bindings/jvm/**", "crates/**", "include/**", "Cargo.*", ".github/workflows/jvm.yml"]

# A newer push supersedes an older one: these runs are long, and two
# generations of them competing for runners helps nobody.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        # Bounded three ways, because this step has now hung twice: once on the
        # dpkg lock and once on an apt mirror that stopped responding mid-fetch.
        # The step timeout is the one that matters — without it a stalled
        # download eats the whole job budget and the run reports as cancelled
        # with no clue why.
        timeout-minutes: 10
        run: |
          set -euo pipefail
          if dpkg -s libfontconfig1-dev >/dev/null 2>&1; then
            echo "already installed"
            exit 0
          fi
          sudo apt-get update \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends -o DPkg::Lock::Timeout=120 \
            libfontconfig1-dev

      - name: Build the native library
        timeout-minutes: 30
        run: cargo build -p sone-ffi

      - uses: actions/setup-java@v4
        with:
          # 22 is the floor for sone-panama; the core and JNA modules target 17.
          distribution: temurin
          java-version: "22"
          cache: maven
      # Walks the C ABI one call at a time, once per backend, each in its own
      # JVM. continue-on-error here is deliberate and narrow: a crashing probe
      # must not stop the other one from running, and what matters is the log,
      # not the step's status. (It is not used on the real test step — masking a
      # failure there is exactly how a broken run looked green earlier.)
      - name: Build for probing
        working-directory: bindings/jvm
        timeout-minutes: 15
        shell: bash
        run: |
          # install, not test-compile: dependency:build-classpath resolves the
          # sibling modules from the repository, not from the reactor.
          mvn --batch-mode -q -DskipTests install
          mvn --batch-mode -q -DskipTests test-compile
          mvn --batch-mode -q -pl sone-tests dependency:build-classpath -Dmdep.outputFile=cp.txt

      - name: Probe the Panama backend
        working-directory: bindings/jvm
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        run: |
          # Windows java wants ';' between classpath entries even under bash.
          SEP=":"
          case "$OSTYPE" in msys*|cygwin*|win*) SEP=";" ;; esac
          java --enable-native-access=ALL-UNNAMED \
            -cp "sone-tests/target/test-classes$SEP$(cat sone-tests/cp.txt)" \
            dev.sone.Probe dev.sone.panama.PanamaBackend

      - name: Probe the JNA backend
        working-directory: bindings/jvm
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        run: |
          # Windows java wants ';' between classpath entries even under bash.
          SEP=":"
          case "$OSTYPE" in msys*|cygwin*|win*) SEP=";" ;; esac
          java --enable-native-access=ALL-UNNAMED \
            -cp "sone-tests/target/test-classes$SEP$(cat sone-tests/cp.txt)" \
            dev.sone.Probe dev.sone.jna.JnaBackend

      # Then the whole suite, including the cross-backend comparison.
      - name: Test
        working-directory: bindings/jvm
        timeout-minutes: 20
        shell: bash
        run: mvn --batch-mode test "-Dsurefire.timeout=300"

      # A VM crash writes its reason to a dump file rather than to stdout, so
      # without this the log says only "terminated without properly saying
      # goodbye".
      - name: Keep the surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.os }}
          path: |
            bindings/jvm/**/target/surefire-reports/**
            bindings/jvm/**/*.dump
            bindings/jvm/**/*.dumpstream
            bindings/jvm/**/hs_err_pid*.log
            bindings/jvm/**/replay_pid*.log
          retention-days: 7
