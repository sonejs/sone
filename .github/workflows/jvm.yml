name: jvm

on:
  push:
    branches: [main]
    paths: ["bindings/jvm/**", "crates/**", "include/**", "Cargo.*", ".github/workflows/jvm.yml"]
  pull_request:
    paths: ["bindings/jvm/**", "crates/**", "include/**", "Cargo.*", ".github/workflows/jvm.yml"]

# A newer push supersedes an older one: these runs are long, and two
# generations of them competing for runners helps nobody.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          # noninteractive and a lock timeout: the plain form hung for
          # hours on a runner waiting for the dpkg lock.
          sudo apt-get update -o Acquire::Retries=3
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends -o DPkg::Lock::Timeout=180 \
            libfontconfig1-dev

      - name: Build the native library
        run: cargo build -p sone-ffi

      - uses: actions/setup-java@v4
        with:
          # 22 is the floor for sone-panama; the core and JNA modules target 17.
          distribution: temurin
          java-version: "22"
          cache: maven
      # One backend per JVM first. BackendTest exercises both in a single
      # process, so when it crashes the log cannot say which half did it —
      # these two steps can.
      - name: Test with the Panama backend
        working-directory: bindings/jvm
        run: mvn --batch-mode test -Dtest=SoneTest -Dsurefire.failIfNoSpecifiedTests=false -Dsone.backend=dev.sone.panama.PanamaBackend

      - name: Test with the JNA backend
        working-directory: bindings/jvm
        run: mvn --batch-mode test -Dtest=SoneTest -Dsurefire.failIfNoSpecifiedTests=false -Dsone.backend=dev.sone.jna.JnaBackend

      # Then the whole suite, including the cross-backend comparison.
      - name: Test
        working-directory: bindings/jvm
        run: mvn --batch-mode test

      # A VM crash writes its reason to a dump file rather than to stdout, so
      # without this the log says only "terminated without properly saying
      # goodbye".
      - name: Keep the surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.os }}
          path: |
            bindings/jvm/**/target/surefire-reports/**
            bindings/jvm/**/*.dump
            bindings/jvm/**/*.dumpstream
            bindings/jvm/**/hs_err_pid*.log
            bindings/jvm/**/hs_err_pid*.mdmp
            bindings/jvm/**/replay_pid*.log
          retention-days: 7
