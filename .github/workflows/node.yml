name: node

on:
  push:
    branches: [main]
    paths:
      ["crates/**", "bindings/node/**", "bindings/wasm/**", "fixtures/**", ".github/workflows/node.yml"]
  pull_request:
    paths:
      ["crates/**", "bindings/node/**", "bindings/wasm/**", "fixtures/**", ".github/workflows/node.yml"]

# A newer push supersedes an older one: these runs are long, and two
# generations of them competing for runners helps nobody.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The native addon, on every runtime that speaks Node-API.
  native:
    name: native · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/node
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        # Bounded three ways, because this step has now hung twice: once on the
        # dpkg lock and once on an apt mirror that stopped responding mid-fetch.
        # The step timeout is the one that matters — without it a stalled
        # download eats the whole job budget and the run reports as cancelled
        # with no clue why.
        timeout-minutes: 10
        run: |
          set -euo pipefail
          if dpkg -s libfontconfig1-dev >/dev/null 2>&1; then
            echo "already installed"
            exit 0
          fi
          sudo apt-get update \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends -o DPkg::Lock::Timeout=120 \
            libfontconfig1-dev
      - run: npm ci

      # `ts/binding.browser.ts` imports `@sonejs/sone-wasm` for its types, and
      # npm resolves that to the sibling workspace, whose `types` field points at
      # `dist/index.d.ts` — a file that only exists once something has built it.
      # Without this step `tsc --noEmit` fails with TS2307. It is the glue-only
      # build: tsdown over `glue/index.ts`, no emscripten and no cargo, half a
      # second. The `.wasm` itself stays unbuilt on purpose — `__test__/wasm.test.ts`
      # keys its skip on `dist/sone.wasm`, so the cross-engine suite stays in the
      # wasm job, which has an emsdk.
      - name: Type declarations for the wasm backend
        run: npm run build:ts --workspace @sonejs/sone-wasm

      # Only Apple targets have a published skia binary matching sone's feature
      # set, so the Linux and Windows legs compile Skia from source. That is
      # pre-existing, not something this binding introduced — but it is why
      # those legs take the best part of an hour on a cold cache.
      - run: npm run build --workspace @sonejs/sone
      - run: npm run lint --workspace @sonejs/sone

      - name: vitest (Node)
        run: npm test --workspace @sonejs/sone

      - uses: oven-sh/setup-bun@v2
      - name: bun
        run: npm run test:bun --workspace @sonejs/sone

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: deno
        run: npm run test:deno --workspace @sonejs/sone

      - uses: actions/upload-artifact@v4
        with:
          name: addon-${{ matrix.os }}
          path: bindings/node/*.node

  # The browser build, plus the cross-engine parity suite that needs both.
  wasm:
    name: wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/wasm
      - run: |
          # noninteractive and a lock timeout: the plain form hung for
          # hours on a runner waiting for the dpkg lock.
          sudo apt-get update -o Acquire::Retries=3
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends -o DPkg::Lock::Timeout=180 \
            libfontconfig1-dev
      - run: npm ci

      # Skia is compiled from source for this target — see bindings/wasm/build.sh
      # for the two independent reasons the published prebuilt cannot be used.
      - run: npm run build --workspace @sonejs/sone-wasm
      - run: npm run lint --workspace @sonejs/sone-wasm

      # The native addon too: __test__/wasm.test.ts diffs the two engines
      # against each other, so both have to be present.
      - run: npm run build --workspace @sonejs/sone
      - run: npm test --workspace @sonejs/sone

      - name: Report the binary size
        run: ls -l bindings/wasm/dist/sone.wasm

      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: |
            bindings/wasm/dist/sone.js
            bindings/wasm/dist/sone.wasm
