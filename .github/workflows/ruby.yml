name: ruby

on:
  push:
    branches: [main]
    paths: ["bindings/ruby/**", "crates/**", "include/**", "Cargo.*", ".github/workflows/ruby.yml"]
  pull_request:
    paths: ["bindings/ruby/**", "crates/**", "include/**", "Cargo.*", ".github/workflows/ruby.yml"]

# A newer push supersedes an older one: these runs are long, and two
# generations of them competing for runners helps nobody.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · ruby ${{ matrix.ruby }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2022]
        ruby: ["3.3"]
        include:
          # A second, older Ruby to catch syntax that only newer versions
          # accept. It has to stay on ubuntu-24.04: no Skia prebuilt matches
          # this feature set on Linux, so the native library is compiled from
          # source, and Skia does not build with 22.04's toolchain — SkPDFTag.cpp
          # fails on gcc-12's <ranges> headers.
          - os: ubuntu-24.04
            ruby: "3.1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          # noninteractive and a lock timeout: the plain form hung for
          # hours on a runner waiting for the dpkg lock.
          sudo apt-get update -o Acquire::Retries=3
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends -o DPkg::Lock::Timeout=180 \
            libfontconfig1-dev

      - name: Build the native library
        run: cargo build -p sone-ffi

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: bindings/ruby
      - name: Test
        working-directory: bindings/ruby
        run: bundle exec rake test
