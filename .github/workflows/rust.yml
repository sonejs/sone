name: rust

on:
  push:
    branches: [main]
    paths: ["crates/**", "include/**", "fixtures/**", "Cargo.*", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["crates/**", "include/**", "fixtures/**", "Cargo.*", ".github/workflows/rust.yml"]

# A newer push supersedes an older one: these runs are long, and two
# generations of them competing for runners helps nobody.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        # Bounded three ways, because this step has now hung twice: once on the
        # dpkg lock and once on an apt mirror that stopped responding mid-fetch.
        # The step timeout is the one that matters — without it a stalled
        # download eats the whole job budget and the run reports as cancelled
        # with no clue why.
        timeout-minutes: 10
        run: |
          set -euo pipefail
          if dpkg -s libfontconfig1-dev >/dev/null 2>&1; then
            echo "already installed"
            exit 0
          fi
          sudo apt-get update \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends -o DPkg::Lock::Timeout=120 \
            libfontconfig1-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  goldens:
    name: goldens
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          # noninteractive and a lock timeout: the plain form hung for
          # hours on a runner waiting for the dpkg lock.
          sudo apt-get update -o Acquire::Retries=3
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends -o DPkg::Lock::Timeout=180 \
            libfontconfig1-dev poppler-utils
      # `embed-freetype` makes glyph rasterization host-independent, so the
      # vendored JPEGs are comparable on any runner.
      - run: cargo run --release -p sone-goldens --bin sone-goldens
      - run: cargo run --release -p sone-goldens --bin layout-diff
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: goldens-report
          path: target/goldens
