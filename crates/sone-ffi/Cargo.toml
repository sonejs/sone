[package]
name = "sone-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "sone"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
sone-core = { path = "../sone-core" }
sone-skia = { path = "../sone-skia" }

[[bin]]
name = "sone-header"
path = "src/bin/sone-header.rs"
required-features = ["generate-header"]

[dependencies.cbindgen]
version = "0.29"
optional = true

[features]
default = []
generate-header = ["dep:cbindgen"]
