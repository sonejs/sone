[package]
name = "sone-skia"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sone-core = { path = "../sone-core" }
# Pinned explicitly rather than through skia-safe's defaults, so a new default
# feature cannot silently grow the binary. `textlayout` unconditionally links
# Skia's ICU table (~10 MB); there is no build flag to drop it in 0.99.
skia-safe = { version = "0.99", default-features = false, features = [
  "binary-cache",
  "pdf",
  "jpeg",
  "textlayout",
  "svg",
  "webp-encode",
  "webp-decode",
] }
thiserror.workspace = true
lru.workspace = true
kurbo.workspace = true

# Windows only, and not optional there: skia-safe calls `icu::init()` from
# ParagraphBuilder::new only under this feature, so without it every paragraph
# panics with "Unicode initialization error". Skia's ICU *code* is already
# linked by `textlayout`; what Windows cannot find at runtime is the data table,
# which this embeds into the binary.
#
# Scoped to windows rather than added to the list above because the feature set
# is also skia-bindings' cache key: enabling it everywhere would stop the
# Android and Apple cross-builds matching a published prebuilt.
[target.'cfg(windows)'.dependencies]
skia-safe = { version = "0.99", default-features = false, features = ["embed-icudtl"] }

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[features]
default = ["embed-freetype"]
# Skia's bundled FreeType rather than the host's. On by default because a
# native build should not depend on what the machine happens to have installed.
# Turn it off for `wasm32-unknown-emscripten`: it is what the emscripten
# prebuilt was built without, and leaving it on turns the binary-cache key into
# `…-ftembed-gl-…`, which nobody publishes — so the build silently falls back to
# compiling Skia from source for an hour.
embed-freetype = ["skia-safe/embed-freetype"]
gpu-metal = ["skia-safe/metal"]
gpu-gl = ["skia-safe/gl"]
gpu-vulkan = ["skia-safe/vulkan"]
gpu-d3d = ["skia-safe/d3d"]
